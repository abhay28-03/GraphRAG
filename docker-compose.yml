services:
  neo4j:
    image: neo4j:5.18-community
    container_name: graphrag_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt Port
    environment:
      - NEO4J_AUTH=neo4j/graphragpassword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphragpassword 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  graphrag-api:
    build: .
    container_name: graphrag_microservice
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphragpassword
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data: